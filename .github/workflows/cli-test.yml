name: CLI Test

on:
  pull_request:
    paths:
      - "cli/**"
      - "templates/**"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "templates/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci
      - run: npm test
