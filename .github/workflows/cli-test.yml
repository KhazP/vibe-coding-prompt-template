name: CLI Test

on:
  pull_request:
    paths:
      - "cli/**"
      - "templates/**"
      - "workflow/**"
      - "scripts/**"
      - ".github/workflows/cli-test.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "templates/**"
      - "workflow/**"
      - "scripts/**"
      - ".github/workflows/cli-test.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run test:package
